---
layout: default
---
<article>
  <header class="article-header">
    <a class="back-link" href="{{ '/writing/' | relative_url }}">← All writing</a>
    <h1>{{ page.title | escape }}</h1>
    <p class="article-meta"><time datetime="{{ page.date | date_to_xmlschema }}">{{ page.date | date: '%B %-d, %Y' }}</time></p>
  </header>
  {{ content }}
</article>
